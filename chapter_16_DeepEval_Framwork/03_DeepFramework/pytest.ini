[pytest]
pythonpath = .
testpaths = tests
addopts = -v --tb=short
markers =
    smoke: free wiring checks, no LLM calls
    chatbot: targets Subsystem A, the ShopSphere chatbot
    rag: targets Subsystem B, the RAG Explorer
    quality: answer quality metrics
    retrieval: retrieval quality metrics
    safety: bias, toxicity, PII
    security: prompt injection, jailbreak, exfiltration, misuse
    geval: custom G-Eval rubrics
    conversational: multi-turn metrics
    slow: makes real LLM calls
    needs_chatbot: skipped unless the chatbot is reachable
    needs_rag: skipped unless the RAG Explorer is reachable
