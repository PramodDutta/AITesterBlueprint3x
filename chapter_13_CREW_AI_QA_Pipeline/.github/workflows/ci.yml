name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint
        run: ruff check .

      - name: Test
        # No Jira and no LLM credentials are provided, so the integration
        # tests stay skipped. Anything that needs them must be marked
        # @pytest.mark.integration.
        env:
          JIRA_QA_CREW_SKIP_DOTENV: "1"
        run: pytest -v --cov=src/jira_qa_crew --cov-report=term-missing

  playwright-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Type-check the generated Playwright fixture
        run: |
          cd tools/playwright-check
          npm install --silent
          npx tsc --noEmit
